[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "video-page-detector"
version = "1.4.3"
description = "Offline PPT page-change detector for classroom recordings"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
  "faster-whisper>=1.2.1,<2",
  "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
include = ["video_page_detector*"]
